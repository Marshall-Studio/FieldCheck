name: Bug report
description: Report incorrect behavior without attaching confidential CSV contents.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FieldCheck. **Do not paste real customer or employee spreadsheet contents.** Use a synthetic example.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked/loaded and in which order.
      placeholder: 1. Load sample… 2. Check for problems…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether you used the sample or a synthetic CSV (size/row count only).
      placeholder: Chrome 131 / Windows 11 / maintenance sample
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include confidential CSV contents or real personal data.
          required: true
